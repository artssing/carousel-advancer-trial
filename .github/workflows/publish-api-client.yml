# Publish @certifine/api-client to GitHub Packages.
#
# Sibling of publish-domain.yml, but with one extra job it must do: this
# package is GENERATED from apps/api, so before publishing it re-derives the
# contract from the running app and fails if the checked-in copy differs.
#
# That check is the whole point of the package. Once certifine-web is its own
# repo, the only thing keeping its idea of the API in step with the API is the
# version it installs — so publishing a schema.ts that no longer matches the
# controllers would hand the web a confident, wrong contract. Better to fail
# here and make somebody run `npm run api:contract`.
#
# Trigger:
#   - push a tag  api-client-v1.2.3   (must match package.json)
#   - or run it by hand from the Actions tab
#
# See docs/setup/domain-package-release.md for the credential story (none —
# GITHUB_TOKEN with packages: write is enough).
name: publish @certifine/api-client

on:
  push:
    tags: ['api-client-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # The generator boots the real NestJS app, which constructs providers, so
    # a database has to answer. Same reason ci/ci-run.sh has a postgres step.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authentik
          POSTGRES_PASSWORD: authentik
          POSTGRES_DB: authentik
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U authentik"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://authentik:authentik@localhost:5432/authentik

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@certifine'

      - run: npm ci --no-audit --no-fund

      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Guard — tag must match package.json
        if: startsWith(github.ref, 'refs/tags/api-client-v')
        run: |
          TAG="${GITHUB_REF#refs/tags/api-client-v}"
          PKG="$(node -p "require('./packages/api-client/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag api-client-v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

      # Schema push rather than migrate: this repo's SSOT is schema.prisma and
      # it has never used migrations (CLAUDE.md). The throwaway service DB just
      # needs the tables to exist so the app can boot.
      - run: npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss

      - name: Regenerate the contract and refuse to publish a stale one
        run: |
          npm run api:contract
          if ! git diff --quiet -- packages/api-client/src/schema.ts apps/api/openapi.json; then
            echo "::error::openapi.json / schema.ts are stale — run 'npm run api:contract' and commit."
            git --no-pager diff --stat -- packages/api-client/src/schema.ts apps/api/openapi.json
            exit 1
          fi

      - run: npm run type-check

      - run: npm publish --workspace=@certifine/api-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
